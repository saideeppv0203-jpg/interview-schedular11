services:
  - type: web
    name: interview-scheduler
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: interview-scheduler-data
      mountPath: /var/data
      sizeGB: 1
